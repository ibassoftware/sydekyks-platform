name: Validate platform

on:
  push:
    branches: [main, codex/partner-pilot]
  pull_request:
  workflow_dispatch:
    inputs:
      saas_candidate:
        description: 'Build a private hosted candidate artifact after validation (SaaS branch only; no deployment)'
        required: false
        default: false
        type: boolean
  workflow_call:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16-trixie@sha256:1e4956185a7fd9306a41ee759a7b4329c4faf9a2bb91a1d01437310c97002433
        env:
          POSTGRES_DB: sydekyks_ci
          POSTGRES_USER: sydekyks_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sydekyks_ci -d sydekyks_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
      postgres-races:
        image: pgvector/pgvector:0.8.1-pg16-trixie@sha256:1e4956185a7fd9306a41ee759a7b4329c4faf9a2bb91a1d01437310c97002433
        env:
          POSTGRES_DB: syd
          POSTGRES_USER: syd
          POSTGRES_PASSWORD: syd-test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U syd -d syd"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - run: bash tools/deploy.sh
      - run: docker compose config --quiet
      - run: bun install --frozen-lockfile
      - run: npm run check:distribution:build
      - run: node --test scripts/audit-distribution-boundaries.test.mjs
      - name: Check release automation scripts
        run: |
          node --check scripts/stage-sydekyks-runtime.mjs
          python3 -m py_compile scripts/smoke-release.py scripts/check-release-version.py
      - run: npm run lint-dev
      - run: git diff --exit-code
      - run: cp packages/server/api/.env.tests.example packages/server/api/.env.tests
      - run: bun x vitest run test/automation/piece-requests.test.ts
        working-directory: packages/core/shared
      - run: bun x vitest run --config packages/server/api/vitest.config.ts packages/server/api/test/integration/ce/sydekyks-free/free-access.test.ts packages/server/api/test/unit/app/pieces/piece-release-compatibility.test.ts
      - run: bun x turbo run build --concurrency=2 --filter=web --filter=@activepieces/engine --filter=api --filter=worker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Check hosted foundations without live services
        env:
          HOSTING_TEST_POSTGRES_PORT: '5432'
          HOSTING_TEST_POSTGRES_USER: sydekyks_ci
          HOSTING_TEST_POSTGRES_PASSWORD: disposable-ci-only
          HOSTING_TEST_POSTGRES_DATABASE: sydekyks_ci
          AP_REDIS_TYPE: STANDALONE
          AP_REDIS_HOST: 127.0.0.1
          AP_REDIS_PORT: '6379'
        run: |
          (cd packages/core/execution && bun x vitest run src/lib/hosting/service-mode.test.ts)
          (cd packages/core/shared && bun x vitest run test/management/hosting-catalog.test.ts)
          bun x vitest run --config packages/server/api/vitest.config.ts packages/server/api/test/unit/hosting-configuration.test.ts packages/server/api/test/unit/hosting-bootstrap.test.ts packages/server/api/test/unit/hosting-installation.test.ts packages/server/api/test/unit/hosting-app-startup.test.ts packages/server/api/test/unit/hosting-worker-rpc.test.ts packages/server/api/test/integration/ce/hosting/hosting-installation-races.test.ts packages/server/api/test/integration/ce/hosting/hosting-auth-execution.test.ts packages/server/api/test/integration/ce/hosting/hosting-onboarding-ledger.test.ts packages/server/api/test/unit/hosting-ledger-pglite.test.ts packages/server/api/test/unit/hosting-managed-pricing.test.ts packages/server/api/test/unit/hosting-ai-allowance.test.ts packages/server/api/test/integration/ce/hosting/hosting-ai-allowance-races.test.ts --maxWorkers=2
          bun x vitest run --config packages/server/api/vitest.config.ts packages/server/api/test/unit/hosting-pricing-revalidation.test.ts --maxWorkers=2
          bun x vitest run --config packages/server/api/vitest.config.ts packages/server/api/test/unit/hosting-learning-workspace.test.ts packages/server/api/test/unit/hosting-customer-credits.test.ts packages/server/api/test/unit/hosting-partner-admin.test.ts packages/server/api/test/unit/hosting-partner-setup.test.ts packages/server/api/test/unit/hosting-tenant-members.test.ts packages/server/api/test/unit/hosting-shared-project.test.ts packages/server/api/test/unit/app/flows/trigger/flow-trigger-side-effect.test.ts packages/server/api/test/unit/lms-course-access.test.ts packages/server/api/test/unit/authorization-not-found.test.ts --maxWorkers=2
          bun x vitest run --config packages/server/worker/vitest.config.ts packages/server/worker/test/lib/worker-service-mode.test.ts --maxWorkers=2
      - name: Check internal Partner Starter provisioning and caps
        run: |
          bun x vitest run --config packages/server/api/vitest.config.ts packages/server/api/test/unit/hosting-manual-accounts.test.ts --maxWorkers=2
          bun x vitest run --config packages/web/vitest.config.ts packages/web/src/features/hosted-operator/manual-account-form.test.tsx packages/web/src/features/hosted-operator/manual-accounts-api.test.ts packages/web/src/features/hosted-operator/credit-allowance-section.test.tsx packages/web/src/features/hosted-billing/billing-view.test.tsx --maxWorkers=2
      - name: Check password security and recovery
        run: bun x vitest run --config packages/server/api/vitest.config.ts packages/server/api/test/unit/password-reset-email.test.ts packages/server/api/test/unit/password-reset-preflight.test.ts packages/server/api/test/integration/ce/authentication/password-reset.test.ts packages/server/api/test/unit/hosting-account-recovery.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Check recovery URL privacy
        run: bun x vitest run --config packages/web/vitest.config.ts packages/web/test/features/authentication/password-reset-secret.test.ts packages/web/test/features/authentication/change-password.test.tsx packages/web/test/lib/route-utils.test.ts --maxWorkers=1
      - name: Check Gmail search scope and unread evidence
        run: bun x vitest run --config packages/pieces/community/gmail/vitest.config.ts packages/pieces/community/gmail/test/search-email.test.ts --maxWorkers=1
      - name: Check dark mode and schedule minimum
        run: |
          bun x vitest run --config packages/web/vitest.config.ts packages/web/test/components/providers/theme-provider.test.tsx --maxWorkers=1
          bun x vitest run --config packages/pieces/core/schedule/vitest.config.ts packages/pieces/core/schedule/test/every-x-minutes.test.ts --maxWorkers=1
      - name: Check frontend TypeScript
        run: bun x tsc -p packages/web/tsconfig.app.json --pretty false
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Check Syd worker and supporting agent regressions
        run: >-
          bun x vitest run --config packages/server/worker/vitest.config.ts
          packages/server/worker/test/lib/execute/jobs/ee/agent
          packages/server/worker/test/lib/agent-eval/agent-tool-call-repair.test.ts
          packages/server/worker/test/lib/agent-eval/agent-turn-credits.test.ts
          packages/server/worker/test/lib/agent-eval/agent-turn-provider-options.test.ts
          --maxWorkers=2
      - name: Check shared skill and provider utility contracts
        run: |
          (cd packages/core/shared && bun x vitest run test/ee/agent-tool-skills.test.ts)
          bun x vitest run --config packages/server/utils/vitest.config.ts packages/server/utils/test/agent-ai-utils.test.ts packages/server/utils/test/agent-openai-retention.test.ts packages/server/utils/test/ai-provider-signal.test.ts
      - name: Check router draft and validation contracts
        run: >-
          bun x vitest run --config packages/core/execution/vitest.config.ts
          packages/core/execution/test/flow/router-validation.test.ts
          packages/core/execution/test/flow/ai-router-branches.test.ts
          packages/core/execution/test/flow/cof-branches.test.ts
          --maxWorkers=2
      - name: Check agent creation and editor regressions
        run: >-
          bun x vitest run --config packages/web/vitest.config.ts
          packages/web/test/features/agents/new-blank-agent-button.test.tsx
          packages/web/test/app/routes/agents
          packages/web/test/app/builder
          packages/web/src/features/agents/agent-appearance-picker.test.tsx
          packages/web/src/app/builder/builder-copilot-panel.test.tsx
          packages/web/test/app/components/sidebar/platform/index.test.tsx
          --maxWorkers=2
      - name: Check Syd API and MCP authorization regressions
        env:
          SYD_TEST_POSTGRES: 'true'
          SYD_TEST_REDIS: 'true'
          AP_ENVIRONMENT: test
          AP_DB_TYPE: POSTGRES
          AP_POSTGRES_HOST: 127.0.0.1
          AP_POSTGRES_PORT: '5432'
          AP_POSTGRES_DATABASE: sydekyks_ci
          AP_POSTGRES_USERNAME: sydekyks_ci
          AP_POSTGRES_PASSWORD: disposable-ci-only
          AP_REDIS_TYPE: STANDALONE
          AP_REDIS_HOST: 127.0.0.1
          AP_REDIS_PORT: '6379'
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node tools/prepare-release-test-db.cjs
          node tools/run-release-api-regressions.cjs

  build-saas-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.saas_candidate && github.ref == 'refs/heads/codex/partner-pilot'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Free runner disk for hosted runtime build
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build hosted candidate without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: sydekyks:saas-candidate-${{ github.sha }}
          build-args: |
            SYDEKYKS_RELEASE_VERSION=1.1.0
            SYDEKYKS_SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=saas-amd64
          cache-to: type=gha,mode=max,scope=saas-amd64
      - name: Verify and export hosted candidate
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="sydekyks:saas-candidate-$SOURCE_REVISION"
          docker run --rm --entrypoint node "$image" -e "const s=require('@activepieces/shared'); if(s.HOSTED_PARTNER_STARTER_MONTHLY_CREDITS!==3500 || Object.keys(s.hostingCatalog.partnerPackages).join(',')!=='core,launch') process.exit(1)"
          mkdir -p saas-candidate
          docker image inspect "$image" --format '{{json .}}' > saas-candidate/image.json
          docker save "$image" | gzip -1 > saas-candidate/image.tar.gz
          (cd saas-candidate && sha256sum image.tar.gz > image.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saas-candidate-${{ github.sha }}
          path: saas-candidate/
          retention-days: 3
          compression-level: 0
