name: Validate platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - run: bash tools/deploy.sh
      - run: docker compose config --quiet
      - run: bun install --frozen-lockfile
      - run: npm run check:distribution:build
      - run: node --test scripts/audit-distribution-boundaries.test.mjs
      - run: npm run lint-dev
      - run: git diff --exit-code
      - run: cp packages/server/api/.env.tests.example packages/server/api/.env.tests
      - run: bun x vitest run --config packages/server/api/vitest.config.ts packages/server/api/test/integration/ce/sydekyks-free/free-access.test.ts
      - run: bun x turbo run build --concurrency=2 --filter=web --filter=@activepieces/engine --filter=api --filter=worker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
